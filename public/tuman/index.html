<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>لوحة الإدارة - سنتر المربد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#f97316;--o2:#fff1e6;--t:#2b2118;--m:#8a7a6c;--b:#f0e6dc;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}body{font-family:Cairo,Tahoma,sans-serif;background:#fffdfb;color:var(--t)}
button,input,textarea{font:inherit;color:inherit}main{max-width:900px;margin:auto;padding:18px}
h1{font-size:20px;margin:6px 0 16px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px}
.fc{background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;cursor:pointer;text-align:center;font-weight:700;transition:transform .4s var(--e),box-shadow .4s var(--e);animation:up .7s var(--e) backwards}.fc:hover{transform:translateY(-4px);box-shadow:0 10px 30px #f973161f}.fc span{display:block;font-size:34px;margin-bottom:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
input,textarea{font-size:16px;width:100%;border:1px solid var(--b);border-radius:14px;padding:11px 14px;background:#fff;margin-top:8px;outline:0}input:focus,textarea:focus{border-color:var(--o)}
.go{border:0;background:var(--o);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;cursor:pointer}.gh{background:var(--o2);color:var(--o)}.rd{background:#fee2e2;color:#b91c1c}.go:disabled{opacity:.5}
.box{background:#fff;border:1px solid var(--b);border-radius:22px;padding:18px;margin-top:14px;animation:up .6s var(--e)}
.pr{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b);flex-wrap:wrap}.pr:last-child{border:0}.pr img,.ph{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--o2);display:grid;place-items:center;font-size:28px}.pr>div{flex:1;min-width:140px;font-size:14px}
.sub{color:var(--m);font-size:12px}#msg{color:#c2410c;font-size:13px;margin-top:8px}label{display:block;font-size:13px;color:var(--m);margin-top:10px}
</style></head><body><main id="app"></main>
<script>
const U='https://hjrryvoavxgidynfzdqj.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcnJ5dm9hdnhnaWR5bmZ6ZHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4Njk3MzIsImV4cCI6MjEwOTQ0NTczMn0.Tjxd6omsb4H3zpFHwYCU-hpE3zQ5Lg76V8bxLCSOkjM';
const $=s=>document.querySelector(s),A=$('#app'),f=n=>(+n).toLocaleString('en')+' د.ع';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const im=p=>/^(data:image|https?:)/.test(p.image_data||'')?`<img src="${esc(p.image_data)}" alt="">`:`<div class="ph">${esc(p.image_data||'🛒')}</div>`;
let tok=sessionStorage.t||'',img='',cur=null;
async function refresh(){const r=sessionStorage.r;if(!r)return false;const x=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:r})});if(!x.ok)return false;const j=await x.json();tok=sessionStorage.t=j.access_token;sessionStorage.r=j.refresh_token;return true}
async function api(p,o={},retry=1){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(tok||K),'Content-Type':'application/json',Prefer:'return=representation'}});const j=await r.json().catch(()=>null);
 if(r.status==401&&retry&&await refresh())return api(p,o,0);if(r.status==401){out();throw new Error('انتهت الجلسة')}if(!r.ok)throw new Error(j?.message||'خطأ');return j}
function login(){A.innerHTML=`<div class="box" style="max-width:360px;margin:12vh auto"><h1>تسجيل دخول الإدارة</h1><input id="u" placeholder="اسم المستخدم" autocomplete="username" autocapitalize="off"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password" onkeydown="event.key=='Enter'&&doLogin()"><div id="msg"></div><button class="go" style="width:100%;margin-top:12px" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('#u').value.trim().toLowerCase()+'@marbid.local',password:$('#p').value})});const j=await r.json();if(!r.ok)throw 0;tok=sessionStorage.t=j.access_token;sessionStorage.r=j.refresh_token;home()}catch{$('#msg').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}}
function out(){sessionStorage.clear();tok='';login()}
function shell(t,b){A.innerHTML=`<div class="top"><h1>${t}</h1><div><button class="go gh" onclick="home()">الرئيسية</button> <button class="go gh" onclick="out()">خروج</button></div></div>${b}`}
function home(){A.innerHTML=`<div class="top"><h1>لوحة إدارة سنتر المربد</h1><button class="go gh" onclick="out()">خروج</button></div><div class="cards"><div class="fc" onclick="form()"><span>➕</span>إضافة منتج</div><div class="fc" onclick="list()"><span>📦</span>المنتجات</div><div class="fc" onclick="orders()"><span>🧾</span>الطلبات</div><div class="fc" onclick="revs()"><span>💬</span>التعليقات والآراء</div><div class="fc" onclick="sets()"><span>🚚</span>إعدادات التوصيل</div></div>`}
function resize(file){return new Promise((res,rej)=>{const i=new Image;i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.onerror=()=>rej();i.src=URL.createObjectURL(file)})}
async function pick(e){const m=$('#msg');m.textContent='';if(!e.files[0])return;try{img=await resize(e.files[0]);$('#pv').src=img;$('#pv').style.display='block'}catch{m.textContent='الملف ليس صورة صالحة'}}
async function form(id){cur=null;img='';if(id){cur=(await api('products?select=*&id=eq.'+id))[0]}
 const p=cur||{};if(/^data:image/.test(p.image_data||''))img=p.image_data;
 shell(cur?'تعديل منتج':'إضافة منتج',`<div class="box"><label>اسم المنتج</label><input id="n" maxlength="120" value="${esc(p.name)}"><label>الكمية</label><input id="q" type="number" min="0" step="1" value="${p.quantity??''}"><label>وصف المنتج (اختياري)</label><textarea id="d" rows="2">${esc(p.description)}</textarea><label>السعر (دينار)</label><input id="pr" type="number" min="0" step="250" value="${p.price??''}"><label>الصورة (من ملفات الجهاز)</label><input id="im" type="file" accept="image/*" onchange="pick(this)"><img id="pv" src="${img}" style="width:110px;border-radius:14px;margin-top:10px;${img?'':'display:none'}"><div id="msg"></div><button class="go" id="sv" style="margin-top:12px" onclick="saveP()">حفظ</button></div>`)}
async function saveP(){const n=$('#n').value.trim(),q=$('#q').value,pr=$('#pr').value,m=$('#msg');
 if(!n||q===''||pr==='')return m.textContent='الاسم والكمية والسعر مطلوبة';if(+q<0||+pr<0||!Number.isInteger(+q)||!Number.isInteger(+pr))return m.textContent='الكمية والسعر لازم يكونون أعداد صحيحة موجبة';
 if(!img&&!(cur&&cur.image_data))return m.textContent='ارفع صورة للمنتج';
 const b={name:n,quantity:+q,description:$('#d').value.trim()||null,price:+pr,updated_at:new Date().toISOString()};if(img)b.image_data=img;
 $('#sv').disabled=true;try{await api(cur?'products?id=eq.'+cur.id:'products',{method:cur?'PATCH':'POST',body:JSON.stringify(b)});list()}catch(x){m.textContent=x.message;$('#sv').disabled=false}}
async function list(){try{const P=await api('products?select=*&order=id.desc');shell('المنتجات ('+P.length+')',`<div class="box">${P.map(p=>`<div class="pr">${im(p)}<div><b>${esc(p.name)}</b><div class="sub">العدد: ${p.quantity} · ${f(p.price)}</div><div class="sub">${esc(p.description)}</div></div><button class="go gh" onclick="form(${p.id})">تعديل</button><button class="go rd" onclick="del(${p.id})">حذف</button></div>`).join('')||'<p class="sub">لا توجد منتجات</p>'}</div>`)}catch(x){alert(x.message)}}
async function del(id){if(!confirm('حذف المنتج؟ (الطلبات السابقة تبقى محفوظة)'))return;try{await api('products?id=eq.'+id,{method:'DELETE'});list()}catch(x){alert(x.message)}}
async function orders(){try{const O=await api('orders?select=*,order_items(*)&order=id.desc&limit=100');shell('الطلبات',`<div class="box">${O.map(o=>`<div class="pr"><div><b>#${o.id} ${esc(o.customer_name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a><div class="sub">${esc(o.area)} - ${esc(o.location)} - ${esc(o.landmark)}</div><div class="sub">${o.order_items.map(i=>esc(i.product_name)+' ×'+i.quantity).join('، ')}</div><div class="sub">${new Date(o.created_at).toLocaleString('en-GB')}</div></div><b>${f(o.total)}</b></div>`).join('')||'<p class="sub">لا توجد طلبات</p>'}</div>`)}catch(x){alert(x.message)}}
async function revs(){try{const R=await api('reviews?select=*&order=id.desc');shell('التعليقات والآراء',`<div class="box">${R.map(r=>`<div class="pr"><div><b>${esc(r.name)}</b> ${'★'.repeat(r.rating)}<div>${esc(r.comment)}</div><div class="sub">${r.approved?'ظاهر للزبائن':'بانتظار الموافقة'}</div></div>${r.approved?`<button class="go gh" onclick="rv(${r.id},false)">إخفاء</button>`:`<button class="go" onclick="rv(${r.id},true)">قبول</button>`}<button class="go rd" onclick="rd(${r.id})">حذف</button></div>`).join('')||'<p class="sub">لا توجد تعليقات</p>'}</div>`)}catch(x){alert(x.message)}}
async function rv(id,a){await api('reviews?id=eq.'+id,{method:'PATCH',body:JSON.stringify({approved:a})});revs()}
async function rd(id){if(confirm('حذف التعليق؟')){await api('reviews?id=eq.'+id,{method:'DELETE'});revs()}}
async function sets(){const S={};(await api('settings?select=*')).forEach(x=>S[x.key]=x.value);shell('إعدادات التوصيل',`<div class="box"><label>أجرة التوصيل (دينار)</label><input id="s1" type="number" min="0" value="${S.delivery_fee}"><label>التوصيل مجاني للطلبات الأكثر من (دينار)</label><input id="s2" type="number" min="0" value="${S.free_over}"><div id="msg"></div><button class="go" style="margin-top:12px" onclick="saveS()">حفظ</button></div>`)}
async function saveS(){try{for(const[k,v]of[['delivery_fee','s1'],['free_over','s2']]){const n=+$('#'+v).value;if(!(n>=0))throw new Error('قيمة غير صحيحة');await api('settings?key=eq.'+k,{method:'PATCH',body:JSON.stringify({value:n})})}$('#msg').style.color='green';$('#msg').textContent='تم الحفظ'}catch(x){$('#msg').textContent=x.message}}
tok?home():login();
</script></body></html>
