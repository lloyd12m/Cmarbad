<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة - سنتر المربد</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--o:#f97316;--o2:#fff1e6;--t:#2b2118;--m:#8a7a6c;--b:#f0e6dc;--e:cubic-bezier(.22,1,.36,1)}
*{box-sizing:border-box;margin:0}body{font-family:Cairo,Tahoma,sans-serif;background:#fffdfb;color:var(--t)}
button,input,textarea{font:inherit;color:inherit}main{max-width:900px;margin:auto;padding:18px}
h1{font-size:20px;margin:6px 0 16px}.top{display:flex;justify-content:space-between;align-items:center}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.fc{background:#fff;border:1px solid var(--b);border-radius:22px;padding:22px;cursor:pointer;text-align:center;font-weight:700;transition:transform .4s var(--e),box-shadow .4s var(--e);animation:up .7s var(--e) backwards}.fc:hover{transform:translateY(-4px);box-shadow:0 10px 30px #f973161f}.fc span{display:block;font-size:34px;margin-bottom:6px}
@keyframes up{from{opacity:0;transform:translateY(14px)}}
input,textarea{width:100%;border:1px solid var(--b);border-radius:14px;padding:11px 14px;background:#fff;margin-top:8px;outline:0}input:focus,textarea:focus{border-color:var(--o)}
.go{border:0;background:var(--o);color:#fff;border-radius:14px;padding:11px 18px;font-weight:700;cursor:pointer}.gh{background:var(--o2);color:var(--o)}.rd{background:#fee2e2;color:#b91c1c}
.box{background:#fff;border:1px solid var(--b);border-radius:22px;padding:18px;margin-top:14px;animation:up .6s var(--e)}
.pr{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--b);flex-wrap:wrap}.pr img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--o2)}.pr div{flex:1;min-width:120px;font-size:14px}
.pr input{width:90px;margin:0}.sub{color:var(--m);font-size:12px}#msg{color:#c2410c;font-size:13px;margin-top:8px}
</style></head><body><main id="app"></main>
<script>
const U='https://hjrryvoavxgidynfzdqj.supabase.co',K='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhqcnJ5dm9hdnhnaWR5bmZ6ZHFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM4Njk3MzIsImV4cCI6MjEwOTQ0NTczMn0.Tjxd6omsb4H3zpFHwYCU-hpE3zQ5Lg76V8bxLCSOkjM';
const $=s=>document.querySelector(s),A=$('#app'),f=n=>(+n).toLocaleString('en')+' د.ع';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let tok=sessionStorage.t||'',img='';
async function api(p,o={}){const r=await fetch(U+'/rest/v1/'+p,{...o,headers:{apikey:K,Authorization:'Bearer '+(tok||K),'Content-Type':'application/json',Prefer:'return=representation'}});const j=await r.json().catch(()=>null);if(!r.ok)throw new Error(j?.message||'خطأ');return j}
function login(){A.innerHTML=`<div class="box" style="max-width:360px;margin:12vh auto"><h1>تسجيل دخول الإدارة</h1><input id="u" placeholder="اسم المستخدم" autocomplete="username"><input id="p" type="password" placeholder="كلمة المرور" autocomplete="current-password"><div id="msg"></div><button class="go" style="width:100%;margin-top:12px" onclick="doLogin()">دخول</button></div>`}
async function doLogin(){try{const r=await fetch(U+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email:$('#u').value.trim()+'@marbid.local',password:$('#p').value})});const j=await r.json();if(!r.ok)throw 0;tok=sessionStorage.t=j.access_token;home()}catch{$('#msg').textContent='اسم المستخدم أو كلمة المرور غير صحيحة'}}
function out(){sessionStorage.clear();tok='';login()}
function shell(t,b){A.innerHTML=`<div class="top"><h1>${t}</h1><div><button class="go gh" onclick="home()">الرئيسية</button> <button class="go gh" onclick="out()">خروج</button></div></div>${b}`}
function home(){A.innerHTML=`<div class="top"><h1>لوحة إدارة سنتر المربد</h1><button class="go gh" onclick="out()">خروج</button></div><div class="cards"><div class="fc" onclick="addP()"><span>➕</span>إضافة منتج</div><div class="fc" onclick="list()"><span>📦</span>المنتجات</div><div class="fc" onclick="orders()"><span>🧾</span>الطلبات</div><div class="fc" onclick="revs()"><span>💬</span>التعليقات والآراء</div></div>`}
function resize(file){return new Promise(res=>{const i=new Image;i.onload=()=>{const s=Math.min(1,600/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.8))};i.src=URL.createObjectURL(file)})}
function addP(){img='';shell('إضافة منتج',`<div class="box"><input id="n" placeholder="اسم المنتج"><input id="q" type="number" min="0" placeholder="الكمية"><textarea id="d" rows="2" placeholder="وصف المنتج (اختياري)"></textarea><input id="pr" type="number" min="0" placeholder="السعر (دينار)"><input id="im" type="file" accept="image/*" onchange="pick(this)"><img id="pv" style="width:110px;border-radius:14px;margin-top:10px;display:none"><div id="msg"></div><button class="go" style="margin-top:12px" onclick="saveP()">حفظ المنتج</button></div>`)}
async function pick(e){if(e.files[0]){img=await resize(e.files[0]);$('#pv').src=img;$('#pv').style.display='block'}}
async function saveP(){const n=$('#n').value.trim();if(!n||!img||$('#q').value===''||$('#pr').value==='')return $('#msg').textContent='الاسم والكمية والسعر والصورة مطلوبة';
 try{await api('products',{method:'POST',body:JSON.stringify({name:n,quantity:+$('#q').value,description:$('#d').value.trim()||null,price:+$('#pr').value,image_data:img})});list()}catch(x){$('#msg').textContent=x.message}}
async function list(){const P=await api('products?select=*&order=id.desc');shell('المنتجات',`<div class="box">${P.map(p=>`<div class="pr"><img src="${p.image_data||''}"><div><b>${esc(p.name)}</b><div class="sub">${esc(p.description)}</div></div><input id="n${p.id}" value="${esc(p.name)}"><input id="q${p.id}" type="number" value="${p.quantity}" title="الكمية"><input id="p${p.id}" type="number" value="${p.price}" title="السعر"><button class="go" onclick="upd(${p.id})">حفظ</button><button class="go rd" onclick="del(${p.id})">حذف</button></div>`).join('')||'<p class="sub">لا توجد منتجات</p>'}</div>`)}
async function upd(id){await api('products?id=eq.'+id,{method:'PATCH',body:JSON.stringify({name:$('#n'+id).value,quantity:+$('#q'+id).value,price:+$('#p'+id).value,updated_at:new Date().toISOString()})});list()}
async function del(id){if(!confirm('حذف المنتج؟'))return;try{await api('products?id=eq.'+id,{method:'DELETE'});list()}catch(x){alert('لا يمكن حذف منتج مرتبط بطلبات سابقة، صفّر كميته بدلاً من ذلك')}}
async function orders(){const O=await api('orders?select=*,order_items(*)&order=id.desc&limit=50');shell('الطلبات',`<div class="box">${O.map(o=>`<div class="pr"><div><b>#${o.id} ${esc(o.customer_name)}</b> · ${esc(o.phone)}<div class="sub">${esc(o.area)} - ${esc(o.location)} - ${esc(o.landmark)}</div><div class="sub">${o.order_items.map(i=>esc(i.product_name)+' ×'+i.quantity).join('، ')}</div></div><b>${f(o.total)}</b></div>`).join('')||'<p class="sub">لا توجد طلبات</p>'}</div>`)}
async function revs(){const R=await api('reviews?select=*&order=id.desc');shell('التعليقات والآراء',`<div class="box">${R.map(r=>`<div class="pr"><div><b>${esc(r.name)}</b> ${'★'.repeat(r.rating)}<div>${esc(r.comment)}</div><div class="sub">${r.approved?'ظاهر للزبائن':'بانتظار الموافقة'}</div></div>${r.approved?`<button class="go gh" onclick="rv(${r.id},false)">إخفاء</button>`:`<button class="go" onclick="rv(${r.id},true)">قبول</button>`}<button class="go rd" onclick="rd(${r.id})">حذف</button></div>`).join('')||'<p class="sub">لا توجد تعليقات</p>'}</div>`)}
async function rv(id,a){await api('reviews?id=eq.'+id,{method:'PATCH',body:JSON.stringify({approved:a})});revs()}
async function rd(id){if(confirm('حذف التعليق؟')){await api('reviews?id=eq.'+id,{method:'DELETE'});revs()}}
tok?home():login();
</script></body></html>
